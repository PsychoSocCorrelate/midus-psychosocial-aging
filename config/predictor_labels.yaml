# Levels of the indicator contrasts the within-family models fit for categorical
# predictors (analysis/pipelines/a6_sibling_decomposition.py, CATEGORICAL_CONFIG).
contrasts:
  workStatus:
    reference: employed
    levels: {retired: retired, not_working: not working}
  occGroup:
    reference: service, sales, or office
    levels: {professional_mgmt: professional or managerial, blue_collar: blue-collar}
  workIndustry:
    reference: services and arts
    levels: {goods_production: goods production, trade_transport: trade and transport,
             knowledge_govt: knowledge and government}
