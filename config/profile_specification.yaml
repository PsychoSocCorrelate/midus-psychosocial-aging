meta:
  procedure: 'Hybrid: reproducible top-K stable mean|SHAP| selection (independent per outcome) + empirical-percentile
    values oriented by SHAP-dependence direction, with documented expert overrides.'
  K: 6
  stability_threshold: 0.6
  value_percentiles:
    favorable_or_unfavorable:
    - 10
    - 90
    neutral: 50
  selection_source: output/cs1_cross_sectional/shap/<outcome>_T1T2_bootstrap_shap.csv
  direction_source: output/cs1_cross_sectional/shap_raw/<outcome>_T1T2_robust_shap.csv
  eligibility: modifiable exposures only; excludes demographic identity and health-service-utilization/clinical-care
    items (reverse-causation prone)
  excluded_identity:
  - female
  - hispanic
  - race
  - sexualOrientation
  excluded_care_utilization:
  - HMOClinic
  - chiropractorFreq
  - emergencyCare
  - haveHealthInsurance
  - medicaid
  - medicare
  - needMedNotGetting
  - outPatient
  - physicalPTFreq
  - physicianDiet
  - privateClinic
  - publicClinic
  - urgentCare
  - useDepression
  - usePainkiller
  - weightChangeHealthIssue
  exclusions:
    FInoPsy_W1: construct-overlap codes a,b (config/frailty_overlap_audit.csv)
  non_focal_baseline: sample median (numeric) / modal category (categorical)
  generated_by: analysis/profile_comparison/build_profiles.py
